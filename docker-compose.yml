# Optional local Postgres for development.
# Docker is NOT required — you can point DATABASE_URL at Neon/Supabase instead (see README).
services:
  db:
    image: postgres:16-alpine
    container_name: pintoria-db
    environment:
      POSTGRES_USER: pintoria
      POSTGRES_PASSWORD: pintoria
      POSTGRES_DB: pintoria_dev
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pintoria -d pintoria_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dbdata:

# Render deployment for the NestJS API (automatic deploys from GitHub).
# Import this file from the Render dashboard or create the service manually with the same values.
# Migrations: `prisma migrate deploy` runs inside the build command, before the service starts.
services:
  - type: web
    name: pintoria-api
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: npm ci && npm run db:migrate && npm run build
    startCommand: npm run start:api
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: WEB_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: STORAGE_DRIVER
        value: r2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: UPLOAD_MAX_MB
        value: "25"
      - key: UPLOAD_ALLOWED_EXT
        value: pdf,jpg,jpeg,png,xlsx,docx,ai,cdr

# Render background worker (replacement for Redis queues, pg-boss) is added in checkpoint 1c as:
#   - type: worker
#     name: pintoria-worker
#     ... same build, startCommand: npm run start:worker
